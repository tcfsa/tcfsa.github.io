        * {
            box-sizing: border-box;
            font-family: "Google Sans Flex", sans-serif;
          font-optical-sizing: auto;
          font-style: normal;
          font-variation-settings: "slnt" 0, "wdth" 100, "GRAD" 0, "ROND" 0;
        }

        body {
            margin: 0;
            /*font-family: Arial, sans-serif;*/
            background: #f4f5f7;
            color: #222;

              font-weight: 500;

        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,.08);
        }


        /* =====================================
           CODE
        ===================================== */

        .code-area {
            text-align: center;
            margin-bottom: 35px;
        }

        .code-label {
            display: block;
            margin-bottom: 12px;
            color: #666;
        }

        /*
            Aperçu du code.

            Les parties choisies sont noires.
            Les parties restantes sont grises.
        */

        .code-preview {
            min-height: 55px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: bold;

            letter-spacing: 1px;

            margin-bottom: 15px;
        }

        .code-black {
            color: #111;
        }

        .code-gray {
            color: #b8b8b8;
        }


        /*
            Champ permettant d'écrire
            manuellement le code.
        */

        #codeInput {
            width: 300px;
            max-width: 100%;

            padding: 11px 14px;

            font-size: 18px;

            text-align: center;

            border: 2px solid #ccc;
            border-radius: 8px;

            outline: none;
        }

        #codeInput:focus {
            border-color: #555;
        }


        /* =====================================
           CHOIX
        ===================================== */

        .choice {
            margin-bottom: 20px;
        }

        .choice.hidden {
            display: none;
        }

        .choice label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select {
            width: 100%;

            padding: 12px;

            font-size: 16px;

            background: white;

            border: 1px solid #ccc;
            border-radius: 7px;

            cursor: pointer;
        }


        /* =====================================
           STATUS
        ===================================== */

        #status {
            text-align: center;
            margin-top: 15px;
            color: #777;
        }


        /* =====================================
           PDF
        ===================================== */

        .pdf-viewer {
            height: 500px;

            margin-top: 30px;

            border: 2px dashed #aaa;
            border-radius: 10px;

            background: white;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #aaa;
        }

        /* =================================
           RECHERCHE ÉTUDIANT
        ================================= */

        .student-search {
            margin-bottom: 20px;
        }

        .student-search label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .student-search input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .student-search input:focus {
            border-color: #777;
        }


        /* =================================
           STATUS RECHERCHE
        ================================= */

        #studentSearchStatus {
            margin-top: 8px;
            font-size: 14px;
        }


        /* =================================
           RÉSULTATS
        ================================= */

        #studentResults {
            margin-top: 20px;
        }


        .student-result {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, .08);
        }


        .student-result-info {
            margin-bottom: 15px;
        }


        .student-result-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }


        .student-result-line {
            margin: 4px 0;
            color: #555;
        }


        .student-result-group {
            font-weight: 700;
            color: #111;
        }


        /* =================================
           PDF
        ================================= */

        .student-pdf-viewer {
    width: 100%;
    height: 700px;

    background: #202124;

    border-radius: 12px;
    overflow: hidden;

    display: flex;
    flex-direction: column;

    box-shadow:
        0 4px 20px rgba(0, 0, 0, .15);
}


.student-pdf-toolbar {
    height: 52px;
    min-height: 52px;

    background: #292929;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 10px 0 16px;
}


.student-pdf-title {
    color: white;

    font-size: 14px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    max-width: 45%;
}


.student-pdf-controls {
    display: flex;
    gap: 6px;
}


.student-pdf-controls button {
    height: 36px;

    border: 0;
    border-radius: 8px;

    background: #3a3a3a;
    color: white;

    cursor: pointer;

    font-size: 14px;

    padding: 0 14px;
}


.student-pdf-controls button:hover {
    background: #505050;
}


.student-pdf-frame {
    width: 100%;
    height: calc(100% - 52px);

    border: 0;

    display: block;

    background: white;
}


@media (max-width: 600px) {

    .student-pdf-viewer {
        height: 600px;
    }

    .student-pdf-toolbar {
        height: 50px;
        min-height: 50px;
    }

    .student-pdf-title {
        max-width: 40%;
        font-size: 12px;
    }

    .student-pdf-controls button {
        padding: 0 8px;
        font-size: 12px;
    }

}


        .student-result-error {
            color: #c0392b;
            padding: 10px;
        }



        .student-search-row {
    display: flex;
    align-items: stretch;
    gap: 10px;
}

.student-search-row button {
    flex: 0 0 auto;

    padding: 0 22px;

    border: 0;
    border-radius: 10px;

    background: #222;
    color: white;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .1s ease;
}

.student-search-row button:hover {
    background: #444;
}

.student-search-row button:active {
    transform: scale(.97);
}

.student-search-row input {
    flex: 1;
    min-width: 0;
}


@media (max-width: 600px) {

    .student-search-row {
        flex-direction: column;
    }

    .student-search-row button {
        width: 100%;
        height: 46px;
    }

    .student-search-row input {
        width: 100%;
    }

}

        /* =====================================================
           OBTENIR L'URL PDF À PARTIR D'UN CODE DE GROUPE
        ===================================================== */

        function getPDFUrlFromGroupCode(groupCode) {

            const value =
                groupCode
                    .trim()
                    .toUpperCase();


            /* =====================================
                            S1
                       P1A G1a
            ===================================== */

            const s1Match =
                value.match(
                    /^P1([ABC])\s*G(\d+)([ABC])$/
                );


            if (s1Match) {

                const sectionValue =
                    s1Match[1];

                const tdValue =
                    s1Match[2];

                const tpValue =
                    s1Match[3].toLowerCase();


                return documents
                    ?.S1
                    ?. [sectionValue]
                    ?. [tdValue]
                    ?. [tpValue]
                    || null;
            }


            /* =====================================
                            S3
                           G1a
            ===================================== */

            const s3Match =
                value.match(
                    /^G(\d+)([ABC])$/
                );


            if (s3Match) {

                const tdValue =
                    s3Match[1];

                const tpValue =
                    s3Match[2].toLowerCase();


                return documents
                    ?.S3
                    ?. [tdValue]
                    ?. [tpValue]
                    || null;
            }


            /* =====================================
                            S5
                           G1
            ===================================== */

            // const s5Match =
            //     value.match(
            //         /^G(\d+)$/
            //     );


            // if (s5Match) {

            //     const tpValue =
            //         s5Match[1];


                /*
                    Pour S5, le groupe seul ne permet
                    pas de savoir si c'est ES ou EER.

                    On utilise donc ES par défaut ici.
                */

            //     return documents
            //         ?.S5
            //         ?.ES
            //         ?. [tpValue]
            //         || null;
            // }

            const s5Match =
                value.match(
                    /^(ES|EER)\s+G(\d+)$/
                );

            if (s5Match) {

                const type =
                    s5Match[1];

                const tpValue =
                    s5Match[2];

                return documents
                    ?.S5
                    ?. [type]
                    ?. [tpValue]
                    || null;
            }



            return null;
        }

        function displayStudentResults(results) {

            studentResults.innerHTML = "";

            results.forEach(function(student) {

                const result = document.createElement("div");
                result.className = "student-result";


                /* =====================================
                   INFORMATIONS
                ===================================== */

                const info = document.createElement("div");
                info.className = "student-result-info";


                const name = document.createElement("div");
                name.className = "student-result-name";
                name.textContent = student.name;


                // const massar = document.createElement("div");
                // massar.className = "student-result-line";
                // massar.textContent =
                //     "Code Massar : " + student.massar;


                const group = document.createElement("div");
                group.className =
                    "student-result-line student-result-group";
                group.textContent =
                    "Code groupe : " + student.group;


                info.appendChild(name);
                // info.appendChild(massar);
                info.appendChild(group);

                result.appendChild(info);


                /* =====================================
                   PDF URL
                ===================================== */

                const pdfUrl =
                    getPDFUrlFromGroupCode(student.group);


                if (!pdfUrl) {

                    const error = document.createElement("div");

                    error.className =
                        "student-result-error";

                    error.textContent =
                        "Aucun PDF trouvé pour le groupe " +
                        student.group;

                    result.appendChild(error);

                    studentResults.appendChild(result);

                    return;
                }


                /* =====================================
                   PDF VIEWER
                ===================================== */

                const viewerBox =
                    document.createElement("div");

                viewerBox.className =
                    "student-pdf-viewer";


                /* =====================================
                   TOOLBAR
                ===================================== */

                const toolbar =
                    document.createElement("div");

                toolbar.className =
                    "student-pdf-toolbar";


                const title =
                    document.createElement("div");

                title.className =
                    "student-pdf-title";

                let filename =
                    pdfUrl.substring(
                        pdfUrl.lastIndexOf("/") + 1
                    );

                try {
                    filename =
                        decodeURIComponent(filename);
                }
                catch (error) {}

                title.textContent = filename;


                const controls =
                    document.createElement("div");

                controls.className =
                    "student-pdf-controls";


                /* =====================================
                   DOWNLOAD
                ===================================== */

                const downloadButton =
                    document.createElement("button");

                downloadButton.textContent =
                    "Télécharger ↓";

                downloadButton.title =
                    "Télécharger";


                downloadButton.addEventListener(
                    "click",
                    function(event) {

                        event.stopPropagation();

                        const link =
                            document.createElement("a");

                        link.href = pdfUrl;
                        link.download = filename;
                        link.target = "_blank";

                        document.body.appendChild(link);

                        link.click();

                        document.body.removeChild(link);

                    }
                );


                /* =====================================
                   FULLSCREEN
                ===================================== */

                const fullscreenButton =
                    document.createElement("button");

                fullscreenButton.textContent = "⛶";

                fullscreenButton.title =
                    "Agrandir";


                    fullscreenButton.addEventListener(
                        "click",
                        function(event) {

                            event.stopPropagation();

                            if (
                                !document.fullscreenElement
                            ) {

                                viewerBox.requestFullscreen();

                                fullscreenButton.textContent =
                                    "↙";

                                fullscreenButton.title =
                                    "Réduire";

                            }
                            else {

                                document.exitFullscreen();

                                fullscreenButton.textContent =
                                    "⛶";

                                fullscreenButton.title =
                                    "Agrandir";
                            }

                        }
                    );


                controls.appendChild(downloadButton);
                controls.appendChild(fullscreenButton);


                toolbar.appendChild(title);
                toolbar.appendChild(controls);


                /* =====================================
                   PDF IFRAME
                ===================================== */

                const iframe =
                    document.createElement("iframe");

                iframe.className =
                    "student-pdf-frame";

                iframe.title =
                    "Emploi du temps - " +
                    student.group;

                iframe.allowFullscreen = true;


                iframe.src =
                    "https://docs.google.com/gview?embedded=true&url=" +
                    encodeURIComponent(pdfUrl);


                /* =====================================
                   ASSEMBLER
                ===================================== */

                viewerBox.appendChild(toolbar);
                viewerBox.appendChild(iframe);

                result.appendChild(viewerBox);

                studentResults.appendChild(result);

            });

        }

function searchStudent() {

    const search =
        studentSearch.value
            .trim()
            .toLowerCase();


    /*
        Recherche vide
    */

    if (!search) {

        studentSearchStatus.textContent =
            // "Veuillez entrer un Code Massar ou un nom.";
            "Veuillez entrer un nom.";

        studentResults.innerHTML = "";

        return;

    }


    /*
        Recherche dans Massar OU nom
    */

    // const results =
    //     students.filter(function(student) {

    //         // const massar =
    //         //     student.massar
    //         //         .toLowerCase();

    //         // const massarWithoutPrefix =
    //         //     student.massar
    //         //         .slice(3)
    //         //         .toLowerCase();

    //         const name =
    //             student.name
    //                 .toLowerCase();


    //         return name.includes(search);
    //         // (
    //             // massar.includes(search) ||
    //             // massarWithoutPrefix.includes(search) ||
    //             // name.includes(search)
    //         // );

    //     });

    const results =
    students.filter(function(student) {

        const name =
            student.name
                .toLowerCase()
                .trim();

        // Normal order: "AABAD Amir"
        if (name.includes(search)) {
            return true;
        }

        // Reversed order: "Amir AABAD"
        const parts = name.split(/\s+/);

        if (parts.length >= 2) {

            const reversedName =
                parts.slice(1).join(" ") +
                " " +
                parts[0];

            if (reversedName.includes(search)) {
                return true;
            }
        }

        return false;

    });


    /*
        Aucun résultat
    */

    if (results.length === 0) {

        studentSearchStatus.textContent =
            "Aucun étudiant trouvé.";

        studentResults.innerHTML = "";

        return;

    }


    /*
        UN SEUL RÉSULTAT
    */

    if (results.length === 1) {

        const student =
            results[0];

        studentSearchStatus.textContent =
            "Étudiant trouvé.";


        /*
            Afficher les informations
            de l'étudiant.
        */

        displayStudentResults(results);


        /*
            Utiliser automatiquement
            le code du groupe.
        */

        codeInput.value =
            student.group;

        codeInput.dispatchEvent(
            new Event("input")
        );

        return;

    }


    /*
        PLUSIEURS RÉSULTATS
    */

    studentSearchStatus.textContent =
        results.length +
        " résultats trouvés.";


    /*
        Ne pas choisir automatiquement
        un groupe.
    */

    displayStudentResults(results);

}

                },

                EER: {

                    8: "https://files.smpfsa.com/edt/TPs/EER5/EER5G8.pdf"
                }

            }

        };


        /* =====================================================
           ELEMENTS
        ===================================================== */

        const semester = document.getElementById("semester");
        const section = document.getElementById("section");
        const filiere = document.getElementById("filiere");
        const td = document.getElementById("td");
        const tp = document.getElementById("tp");

        const codePreview = document.getElementById("codePreview");
        const codeInput = document.getElementById("codeInput");
        const status = document.getElementById("status");

        const sectionBox = document.getElementById("sectionBox");
        const filiereBox = document.getElementById("filiereBox");
        const tdBox = document.getElementById("tdBox");
        const tpBox = document.getElementById("tpBox");


        /* =====================================================
           OUTILS
        ===================================================== */

        function hide(element) {
            element.classList.add("hidden");
        }


        function show(element) {
            element.classList.remove("hidden");
        }


        function resetSelect(select) {

            select.innerHTML = `
                <option value="">
                    -- Choisir --
                </option>
            `;

        }


        /*
            Remplit un select en essayant
            de conserver sa valeur actuelle.
        */

        function fillSelect(select, values, wantedValue = null) {

            const oldValue =
                wantedValue !== null
                    ? String(wantedValue)
                    : select.value;

            resetSelect(select);

            values.forEach(function(value) {

                const option =
                    document.createElement("option");

                option.value = value;
                option.textContent = value;

                select.appendChild(option);

            });


            if (values.includes(oldValue)) {

                select.value = oldValue;

            } else {

                select.value = "";

            }

        }


        /* =====================================================
           CREATION DES CHOIX
        ===================================================== */

        function createSections(value = null) {

            fillSelect(
                section,
                ["A", "B", "C"],
                value
            );

        }


        function createFilieres(value = null) {

            fillSelect(
                filiere,
                // ["ES"],
                ["ES", "EER"],
                value
            );

        }


        function createTD(nombre, value = null) {

            const values = [];

            for (
                let i = 1;
                i <= nombre;
                i++
            ) {

                values.push(String(i));

            }

            fillSelect(
                td,
                values,
                value
            );

        }


        function createTPLetters(groupes, value = null) {

            fillSelect(
                tp,
                groupes,
                value
            );

        }


        function createTPNumbers(value = null) {

            const values = [];

            for (
                let i = 1;
                i <= NOMBRE_TP_S5;
                i++
            ) {

                values.push(String(i));

            }

            fillSelect(
                tp,
                values,
                value
            );

        }


        /* =====================================================
           CHANGEMENT DE SEMESTRE
        ===================================================== */

        function changeSemester(newSemester) {

            /*
                Si le semestre est déjà le même,
                on ne détruit rien.
            */

            if (semester.value === newSemester) {
                return;
            }


            semester.value = newSemester;


            /*
                On cache seulement les éléments
                qui ne correspondent pas au nouveau
                semestre.
            */

            hide(sectionBox);
            hide(filiereBox);
            hide(tdBox);
            hide(tpBox);


            /* ==========================
                      S1
            ========================== */

            if (newSemester === "S1") {

                createSections();

                show(sectionBox);

            }
            else if (newSemester === "S3")
            {
                createTD(NOMBRE_TD_S3);
                show(tdBox);
            }
            else if (newSemester === "S5")
            {
                createFilieres();
                show(filiereBox);
            }

            updateCodeDisplay();
        }


        /* =====================================================
           RESET COMPLET
        ===================================================== */

        function resetEverything() {

            semester.value = "";

            resetSelect(section);
            resetSelect(filiere);
            resetSelect(td);
            resetSelect(tp);

            hide(sectionBox);
            hide(filiereBox);
            hide(tdBox);
            hide(tpBox);

            status.textContent = "";

        }


        /* =====================================================
           AFFICHAGE DU CODE
        ===================================================== */

        function updateCodeDisplay() {

            const sem = semester.value;


            /* =====================================
               AUCUN SEMESTRE
            ===================================== */

            if (!sem) {

                codePreview.innerHTML = `
                    <span class="code-gray">
                        Choisir...
                    </span>
                `;

                /*
                    On ne force pas l'input ici si
                    l'utilisateur est en train d'écrire.
                */

                return;
            }


            /* =====================================
                            S1
                          P1A G1a
            ===================================== */

            if (sem === "S1") {

                const sectionCode =
                    section.value || "A";

                const tdCode =
                    td.value || "1";

                const tpCode =
                    tp.value || "a";


                /*
                    PREVIEW
                */

                codePreview.innerHTML = `

                    <span class="code-black">
                        P1
                    </span>

                    <span class="${
                        section.value
                            ? "code-black"
                            : "code-gray"
                    }">
                        ${sectionCode}
                    </span>

                    <span class="code-black">
                        &nbsp;G
                    </span>

                    <span class="${
                        td.value
                            ? "code-black"
                            : "code-gray"
                    }">
                        ${tdCode}
                    </span>

                    <span class="${
                        tp.value
                            ? "code-black"
                            : "code-gray"
                    }">
                        ${tpCode}
                    </span>

                `;


                /*
                    INPUT

                    Il change immédiatement
                    lorsque les choix changent.
                */

                codeInput.value =
                    `P1${sectionCode} G${tdCode}${tpCode}`;


                return;
            }


            /* =====================================
                            S3
                           G1a
            ===================================== */

            if (sem === "S3") {

                const tdCode =
                    td.value || "1";

                const tpCode =
                    tp.value || "a";


                codePreview.innerHTML = `

                    <span class="code-black">
                        G
                    </span>

                    <span class="${
                        td.value
                            ? "code-black"
                            : "code-gray"
                    }">
                        ${tdCode}
                    </span>

                    <span class="${
                        tp.value
                            ? "code-black"
                            : "code-gray"
                    }">
                        ${tpCode}
                    </span>

                `;


                /*
                    INPUT
                */

                codeInput.value =
                    `G${tdCode}${tpCode}`;


                return;
            }


            /* =====================================
                            S5
                           G1
            ===================================== */

            if (sem === "S5") {

                const tpCode =
                    tp.value || "1";


                codePreview.innerHTML = `

                    <span class="code-black">
                        G
                    </span>

                    <span class="${
                        tp.value
                            ? "code-black"
                            : "code-gray"
                    }">
                        ${tpCode}
                    </span>

                `;


                /*
                    INPUT
                */

                codeInput.value =
                    `G${tpCode}`;


                return;
            }

        }


        /* =====================================================
           SEMESTRE SELECT
        ===================================================== */

        semester.addEventListener(
            "change",
            function() {

                /*
                    Ici seulement on fait un
                    changement complet de structure.
                */

                const newSemester =
                    semester.value;


                resetSelect(section);
                resetSelect(filiere);
                resetSelect(td);
                resetSelect(tp);

                hide(sectionBox);
                hide(filiereBox);
                hide(tdBox);
                hide(tpBox);


                if (newSemester === "S1") {

                    createSections();

                    show(sectionBox);

                }


                else if (newSemester === "S3") {

                    createTD(NOMBRE_TD_S3);

                    show(tdBox);

                }


                else if (newSemester === "S5") {

                    createFilieres();

                    show(filiereBox);

                }


                updateCodeDisplay();

            }
        );


        /* =====================================================
           S1 → SECTION
        ===================================================== */

        section.addEventListener(
            "change",
            function() {

                if (!section.value) {

                    hide(tdBox);
                    hide(tpBox);

                    updateCodeDisplay();

                    return;

                }


                /*
                    On garde les valeurs existantes.
                */

                const oldTD =
                    td.value;

                const oldTP =
                    tp.value;


                createTD(
                    NOMBRE_TD_S1,
                    oldTD
                );

                show(tdBox);


                /*
                    Si un TD existait déjà
                    et qu'il est toujours valide,
                    on garde aussi le TP.
                */

                if (td.value) {

                    createTPLetters(
                        GROUPES_TP_S1,
                        oldTP
                    );

                    show(tpBox);

                }


                updateCodeDisplay();


                if (
                    td.value &&
                    tp.value
                ) {

                    fetchPDF();

                }

            }
        );


        /* =====================================================
           S5 → FILIERE
        ===================================================== */

        filiere.addEventListener(
            "change",
            function() {

                if (!filiere.value) {

                    hide(tpBox);

                    updateCodeDisplay();

                    return;

                }


                const oldTP =
                    tp.value;


                createTPNumbers(
                    oldTP
                );

                show(tpBox);


                updateCodeDisplay();


                if (tp.value) {

                    fetchPDF();

                }

            }
        );


        /* =====================================================
           TD → TP
        ===================================================== */

        td.addEventListener(
            "change",
            function() {

                if (!td.value) {

                    hide(tpBox);

                    updateCodeDisplay();

                    return;

                }


                /*
                    On garde le TP actuel
                    s'il existe toujours.
                */

                const oldTP =
                    tp.value;


                if (semester.value === "S1") {

                    createTPLetters(
                        GROUPES_TP_S1,
                        oldTP
                    );

                    show(tpBox);

                }


                else if (semester.value === "S3") {

                    createTPLetters(
                        GROUPES_TP_S3,
                        oldTP
                    );

                    show(tpBox);

                }


                updateCodeDisplay();


                if (tp.value) {

                    fetchPDF();

                }

            }
        );


        /* =====================================================
           TP
        ===================================================== */

        tp.addEventListener(
            "change",
            function() {

                updateCodeDisplay();

                fetchPDF();

            }
        );


        /* =====================================================
           INPUT CODE
        ===================================================== */

        codeInput.addEventListener(
            "input",
            function() {

                let value =
                    codeInput.value
                        .trim()
                        .toUpperCase();


                /*
                    Retirer les espaces inutiles.
                */

                value =
                    value.replace(/\s+/g, " ");


                /*
                    =====================================
                            INPUT VIDE
                    =====================================
                */

                if (!value) {

                    resetEverything();

                    updateCodeDisplay();

                    return;

                }


                /*
                    =====================================
                               S1
                            P1A G1a
                    =====================================
                */

                const s1Match =
                    value.match(
                        /^P1([ABC])\s*G(\d+)([A-Z])$/
                    );


                if (s1Match) {

                    const sectionValue =
                        s1Match[1];

                    const tdValue =
                        Number(s1Match[2]);

                    const tpValue =
                        s1Match[3].toLowerCase();


                    /*
                        Vérifier TD
                    */

                    if (
                        tdValue < 1 ||
                        tdValue > NOMBRE_TD_S1
                    ) {

                        return;

                    }


                    /*
                        Vérifier TP
                    */

                    if (
                        !GROUPES_TP_S1.includes(tpValue)
                    ) {

                        return;

                    }


                    /*
                        IMPORTANT :

                        On passe réellement à S1.
                    */

                    if (
                        semester.value !== "S1"
                    ) {

                        changeSemester("S1");

                    }


                    /*
                        Section
                    */

                    createSections(
                        sectionValue
                    );

                    section.value =
                        sectionValue;

                    show(sectionBox);


                    /*
                        TD
                    */

                    createTD(
                        NOMBRE_TD_S1,
                        tdValue
                    );

                    td.value =
                        String(tdValue);

                    show(tdBox);


                    /*
                        TP
                    */

                    createTPLetters(
                        GROUPES_TP_S1,
                        tpValue
                    );

                    tp.value =
                        tpValue;

                    show(tpBox);


                    updateCodeDisplay();


                    /*
                        PDF uniquement maintenant,
                        car le code est complet.
                    */

                    fetchPDF();

                    return;

                }


                /*
                    =====================================
                               S3
                               G1a
                    =====================================
                */

                const s3Match =
                    value.match(
                        /^G(\d+)([A-Z])$/
                    );


                if (s3Match) {

                    const tdValue =
                        Number(s3Match[1]);

                    const tpValue =
                        s3Match[2].toLowerCase();


                    if (
                        tdValue < 1 ||
                        tdValue > NOMBRE_TD_S3
                    ) {

                        return;

                    }


                    if (
                        !GROUPES_TP_S3.includes(tpValue)
                    ) {

                        return;

                    }


                    /*
                        Passage réel vers S3.
                    */

                    if (
                        semester.value !== "S3"
                    ) {

                        changeSemester("S3");

                    }


                    /*
                        TD
                    */

                    createTD(
                        NOMBRE_TD_S3,
                        tdValue
                    );

                    td.value =
                        String(tdValue);

                    show(tdBox);


                    /*
                        TP
                    */

                    createTPLetters(
                        GROUPES_TP_S3,
                        tpValue
                    );

                    tp.value =
                        tpValue;

                    show(tpBox);


                    updateCodeDisplay();

                    fetchPDF();

                    return;

                }


                /*
                    =====================================
                               S5
                               G1
                    =====================================
                */

                const s5Match =
                    value.match(
                        /^G(\d+)$/
                    );


                if (s5Match) {

                    const tpValue =
                        Number(s5Match[1]);


                    if (
                        tpValue < 1 ||
                        tpValue > NOMBRE_TP_S5
                    ) {

                        return;

                    }


                    /*
                        Passage réel vers S5.
                    */

                    if (
                        semester.value !== "S5"
                    ) {

                        changeSemester("S5");

                    }


                    /*
                        Si aucune filière n'est choisie,
                        ES est utilisée par défaut.

                        Si EER est déjà choisie,
                        elle reste EER.
                    */

                    if (!filiere.value) {

                        createFilieres("ES");

                        filiere.value =
                            "ES";

                    }
                    else {

                        createFilieres(
                            filiere.value
                        );

                    }


                    show(filiereBox);


                    /*
                        TP
                    */

                    createTPNumbers(
                        tpValue
                    );

                    tp.value =
                        String(tpValue);

                    show(tpBox);


                    updateCodeDisplay();

                    fetchPDF();

                    return;

                }

            }
        );


        /* =====================================================
           FETCH PDF
        ===================================================== */

        function fetchPDF() {

            const sem =
                semester.value;

            let url = null;


            /*
                S1
            */

            if (sem === "S1") {

                if (
                    !section.value ||
                    !td.value ||
                    !tp.value
                ) {

                    return;

                }


                url =
                    documents
                        ?.S1
                        ?. [section.value]
                        ?. [td.value]
                        ?. [tp.value];

            }


            /*
                S3
            */

            else if (sem === "S3") {

                if (
                    !td.value ||
                    !tp.value
                ) {

                    return;

                }


                url =
                    documents
                        ?.S3
                        ?. [td.value]
                        ?. [tp.value];

            }


            /*
                S5
            */

            else if (sem === "S5") {

                if (
                    !filiere.value ||
                    !tp.value
                ) {

                    return;

                }


                url =
                    documents
                        ?.S5
                        ?. [filiere.value]
                        ?. [tp.value];

            }


            /*
                Pas d'URL
            */

            if (!url) {

                console.warn(
                    "Aucun PDF pour cette combinaison."
                );

                status.textContent =
                    "Aucun PDF pour cette combinaison.";

                return;

            }


            /*
                IMPORTANT :

                Ici on affiche seulement l'URL.
                Le fetch peut être supprimé si
                ton propre PDF viewer reçoit
                directement cette URL.
            */

            console.log(
                "URL PDF :",
                url
            );

            if(studentSearch.value=="")
            {
                betterviewf(url);
            }


            status.textContent =
                "PDF sélectionné.";


            /*
                =====================================
                TON PDF VIEWER
                =====================================

                Exemple :

                monPdfViewer.load(url);

            */

        }


        /* =====================================================
           INITIALISATION
        ===================================================== */

        resetEverything();

        updateCodeDisplay();

        </script>

                      opacity .2s ease,
                      width .3s ease,
                      height .3s ease,
                      top .3s ease,
                      left .3s ease,
                      border-radius .3s ease;
              }

              /* =========================================================
                 FULLSCREEN PDF
                 ========================================================= */

              #pdfWindow.pdf-expanded {
                  position: fixed !important;

                  top: 0 !important;
                  right: 0 !important;
                  bottom: 0 !important;
                  left: 0 !important;

                  width: 100vw !important;
                  height: 100vh !important;

                  max-width: none !important;
                  max-height: none !important;

                  margin: 0 !important;
                  border-radius: 0 !important;

                  transform: none !important;
                  opacity: 1 !important;

                  z-index: 100000 !important;
              }

              /* Make the PDF itself fill the fullscreen window */
              #pdfWindow.pdf-expanded #pdfViewer {
                  height: calc(100% - 52px) !important;
                  width: 100% !important;
              }

              #pdfPopup.open #pdfWindow {
                  transform: scale(1);
                  opacity: 1;
              }


              /* =========================================================
                 TOOLBAR
                 ========================================================= */

              #pdfToolbar {
                  height: 52px;
                  min-height: 52px;

                  background: #292929;

                  display: flex;
                  align-items: center;
                  justify-content: space-between;

                  padding: 0 10px 0 16px;

                  box-sizing: border-box;
              }

              #pdfTitle {
                  color: white;

                  font-size: 14px;

                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;

                  max-width: 45%;
              }

              #pdfControls {
                  display: flex;
                  gap: 6px;
              }

              #pdfControls button {
                  width: 53px;
                  height: 36px;

                  border: 0;
                  border-radius: 8px;

                  background: #3a3a3a;
                  color: white;

                  cursor: pointer;

                  font-size: 20px;

                  margin: 0;
                  padding: 0;
              }

              #pdfControls button:hover {
                  background: #505050;
              }


              /* =========================================================
                 PDF VIEWER
                 ========================================================= */

              #pdfViewer {
                  width: 100%;
                  height: calc(100% - 52px);

                  border: 0;
                  display: block;

                  background: white;
              }


              /* =========================================================
                 SPLIT MODE
                 ========================================================= */

              /*
                 IMPORTANT:
                 In split mode the popup itself becomes transparent
                 and DOES NOT block the page.
              */

              #pdfPopup.pdf-split {
                  background: transparent;

                  pointer-events: none;

                  align-items: flex-start;
                  justify-content: flex-start;
              }


              /*
                 PC:
                 PDF occupies the TOP half of the screen.
              */

              #pdfPopup.pdf-split #pdfWindow {
                  position: fixed;

                  top: 0;
                  left: 0;

                  width: 100vw;
                  height: 50vh;

                  max-width: none;
                  max-height: none;

                  border-radius: 0;

                  transform: none !important;
                  opacity: 1;

                  box-shadow: 0 4px 20px rgba(0,0,0,.35);

                  pointer-events: auto;
              }

              /* =========================================================
                 PAGE AREA WHEN PDF IS SPLIT
                 ========================================================= */

              /* =========================================================
                 PAGE AREA WHEN PDF IS SPLIT
                 ========================================================= */

              body.pdf-split-mode {
                  overflow: hidden !important;
              }

              /*
                 The page occupies the entire lower half.
                 Force it to 100vw so existing container widths,
                 margins, max-widths, etc. cannot make it narrower.
              */
              body.pdf-split-mode .container {
                  position: fixed !important;

                  left: 0 !important;
                  right: 0 !important;
                  bottom: 0 !important;

                  width: 100vw !important;
                  max-width: none !important;

                  height: 43vh !important;
                  max-height: 43vh !important;

                  margin-left: 0 !important;
                  margin-right: 0 !important;

                  overflow-y: auto;
                  overflow-x: hidden;

                  box-sizing: border-box;
              }


              /* =========================================================
                 MINIMIZED MODE
                 ========================================================= */

              #pdfPopup.pdf-minimized {
                  background: transparent;

                  pointer-events: none;

                  align-items: flex-start;
                  justify-content: flex-start;
              }


              /*
                 Small floating window.
              */

              #pdfPopup.pdf-minimized #pdfWindow {
                  position: fixed;

                  width: 360px;
                  height: 52px;

                  top: 20px;
                  right: 20px;
                  left: auto;

                  border-radius: 10px;

                  transform: none !important;
                  opacity: 1;

                  box-shadow: 0 8px 30px rgba(0,0,0,.45);

                  cursor: pointer;

                  pointer-events: auto;
              }


              /*
                 Hide the PDF itself while minimized.
              */

              #pdfPopup.pdf-minimized #pdfViewer {
                  display: none;
              }


              /*
                 Toolbar becomes the entire minimized window.
              */

              #pdfPopup.pdf-minimized #pdfToolbar {
                  height: 52px;
                  min-height: 52px;

                  border-radius: 10px;
              }


              /*
                 Filename has more room when minimized.
              */

              #pdfPopup.pdf-minimized #pdfTitle {
                  flex: 1;
                  min-width: 0;
                  max-width: none;

                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;

                  margin-right: 8px;
              }


              /*
                 Hide the split button while minimized.
              */

              #pdfPopup.pdf-minimized #pdfHalfButton {
                  display: none;
              }


              /* =========================================================
                 MOBILE
                 ========================================================= */

              @media (max-width: 600px) {

                  #pdfPopup {
                      padding: 0;
                  }

                  #pdfWindow {
                      width: 95vw;
                      height: 90dvh;

                      border-radius: 12px;
                  }


                  /*
                     MOBILE SPLIT

                     PDF takes the upper half of the screen.
                     The bottom half remains fully interactive.
                  */

                  #pdfPopup.pdf-split #pdfWindow {
                      top: 0;
                      left: 0;

                      width: 100vw;
                      height: 50dvh;

                      border-radius: 0;
                  }


                  #pdfToolbar {
                      height: 50px;
                      min-height: 50px;
                  }

                  #pdfViewer {
                      height: calc(100% - 50px);
                  }


                  /*
                     Mobile minimized window
                  */

                  #pdfPopup.pdf-minimized #pdfWindow {
                      width: calc(100vw - 20px);
                      height: 50px;

                      top: 10px;
                      right: 10px;
                      left: 10px;

                      border-radius: 10px;
                  }

                  #pdfPopup.pdf-minimized #pdfToolbar {
                      height: 50px;
                      min-height: 50px;
                  }

                  #pdfPopup.pdf-minimized #pdfTitle {
                    flex: 1;
                    min-width: 0;
                    max-width: none;

                    overflow: hidden;
                    text-overflow: ellipsis;
                    white-space: nowrap;
                }

                  #pdfControls {
                      gap: 4px;
                  }

                  #pdfControls button {
                      width: 44px;
                      height: 34px;
                      font-size: 18px;
                  }
              }

              /* =========================================================
                 MINIMIZED PDF - MAKE FILENAME VISIBLE
                 ========================================================= */

              #pdfPopup.pdf-minimized #pdfToolbar {
                  display: flex;
                  align-items: center;
                  justify-content: flex-start;
                  padding: 0 8px 0 14px;
                  gap: 8px;
              }

              /* Filename gets a real area in the minimized window */
              #pdfPopup.pdf-minimized #pdfTitle {
                  display: block !important;

                  flex: 1 1 auto;
                  width: auto;
                  min-width: 0;
                  max-width: none !important;

                  color: #ffffff !important;
                  font-size: 14px;
                  font-weight: 500;

                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;

                  visibility: visible !important;
                  opacity: 1 !important;
              }

              /*
                 The controls must not be allowed to push
                 the filename completely off screen.
              */
              #pdfPopup.pdf-minimized #pdfControls {
                  flex: 0 0 auto;
                  width: auto;
                  display: flex;
                  align-items: center;
                  gap: 5px;
              }

              /*
                 The large "Ouvrir en mode PC" button takes
                 almost the entire toolbar normally, so hide it
                 when minimized.
              */
              #pdfPopup.pdf-minimized #pdfControls button:first-child {
                  display: none;
              }

              /* Split button is already hidden, keep it hidden */
              #pdfPopup.pdf-minimized #pdfHalfButton {
                  display: none;
              }

              /*
                 Give the minimized window enough width
                 for the filename + controls.
              */
              #pdfPopup.pdf-minimized #pdfWindow {
                  width: 420px;
                  max-width: calc(100vw - 20px);
              }

              /* Mobile */
              @media (max-width: 600px) {

                  #pdfPopup.pdf-minimized #pdfWindow {
                      width: calc(100vw - 20px);
                  }

                  #pdfPopup.pdf-minimized #pdfTitle {
                      flex: 1 1 auto;
                      max-width: none !important;
                      min-width: 0;
                      font-size: 13px;
                  }

                  #pdfPopup.pdf-minimized #pdfControls {
                      flex-shrink: 0;
                  }
              }

            </style>

            <script type="text/javascript">

                // const popup = document.getElementById("pdfPopup");

                //   popup.classList.remove("pdf-split");

                //   windowElement.classList.remove("pdf-expanded");

                //   /* Show popup */

                //   popup.classList.add("open");

                //   // document.body.style.overflow = "hidden";


                  let currentPDFUrl = "";


                  /* =========================================================
                     OPEN PDF
                     ========================================================= */

                  function betterviewf(pdfUrl)
                  {
                      currentPDFUrl = pdfUrl;

                      const popup = document.getElementById("pdfPopup");
                      const viewer = document.getElementById("pdfViewer");
                      const title = document.getElementById("pdfTitle");
                      const windowElement = document.getElementById("pdfWindow");

                      /*
                         Every time a new PDF is opened,
                         start in normal popup mode.
                      */

                      popup.classList.remove("pdf-split");
                      popup.classList.remove("pdf-minimized");

                      windowElement.classList.remove("pdf-expanded");
                      windowElement.classList.remove("pdf-half");


                      /* Filename */

                      let filename = pdfUrl.substring(
                          pdfUrl.lastIndexOf("/") + 1
                      );

                      filename = decodeURIComponent(filename);

                      title.textContent = filename;


                      /* Google PDF viewer */

                      viewer.src =
                          "https://docs.google.com/gview?embedded=true&url=" +
                          encodeURIComponent(pdfUrl);


                      /* Show popup */

                      popup.classList.add("open");

                      // document.body.style.overflow = "hidden";


                      // // Aller tout en bas instantanément
                      //   window.scrollTo(0, document.body.scrollHeight);

                        // Aller tout en bas avec un effet fluide

                        if(studentSearch.value=="")
                        {
                            window.scrollTo({
                              top: document.body.scrollHeight,
                              behavior: 'smooth'
                            });
                        }

                  }


                  /* =========================================================
                     OPEN DIRECT PDF
                     ========================================================= */

                  function openDirectPDF()
                  {
                      if (!currentPDFUrl) return;

                      const viewer = document.getElementById("pdfViewer");

                      viewer.src = currentPDFUrl;
                  }

                  /* =========================================================
                   DOWNLOAD PDF
                   ========================================================= */

                    function downloadPDF()
                    {
                        if (!currentPDFUrl) {
                            return;
                        }

                        const link = document.createElement("a");

                        link.href = currentPDFUrl;

                        console.log(currentPDFUrl);

                        /*
                           Récupère le nom du fichier depuis l'URL.
                        */

                        let filename =
                            currentPDFUrl.substring(
                                currentPDFUrl.lastIndexOf("/") + 1
                            );

                        try {
                            filename = decodeURIComponent(filename);
                        }
                        catch (error) {
                            console.warn(
                                "Impossible de décoder le nom du fichier."
                            );
                        }

                        /*
                           Demande au navigateur de télécharger
                           le fichier au lieu de l'ouvrir.
                        */

                        link.download = filename || "document.pdf";

                        link.target = "_blank";

                        document.body.appendChild(link);

                        link.click();

                        document.body.removeChild(link);
                    }


                  /* =========================================================
                     CLOSE
                     ========================================================= */

                  function closePDF()
                  {
                      const popup = document.getElementById("pdfPopup");
                      const viewer = document.getElementById("pdfViewer");

                      /* IMPORTANT:
                         Always remove the page split state when closing.
                      */
                      document.body.classList.remove("pdf-split-mode");

                      popup.classList.remove("open");
                      popup.classList.remove("pdf-split");
                      popup.classList.remove("pdf-minimized");

                      document.body.style.overflow = "";

                      setTimeout(() => {
                          viewer.src = "";
                      }, 300);
                  }


                  /* =========================================================
                     MINIMIZE
                     ========================================================= */

                  function minimizePDF()
                  {
                      const popup = document.getElementById("pdfPopup");
                      const windowElement = document.getElementById("pdfWindow");

                      /*
                         If fullscreen is active, remove it first.
                      */
                      windowElement.classList.remove("pdf-expanded");

                      /*
                         If split mode is active, remove the page split state.
                      */
                      popup.classList.remove("pdf-split");
                      document.body.classList.remove("pdf-split-mode");

                      /*
                         Now minimize normally.
                      */
                      popup.classList.add("pdf-minimized");

                      /*
                         Make the page normal and scrollable again.
                      */
                      document.body.style.overflow = "";
                  }


                  /* =========================================================
                     RESTORE MINIMIZED PDF
                     ========================================================= */

                  function restorePDF()
                  {
                      const popup = document.getElementById("pdfPopup");

                      if (!popup.classList.contains("pdf-minimized")) {
                          return;
                      }

                      popup.classList.remove("pdf-minimized");

                      // document.body.style.overflow = "hidden";
                      document.body.style.overflow = "visible";
                  }


                  /* =========================================================
                     CLICK MINIMIZED WINDOW
                     ========================================================= */

                  document.addEventListener("click", function(event)
                  {
                      const popup = document.getElementById("pdfPopup");
                      const windowElement = document.getElementById("pdfWindow");

                      /*
                         If minimized and the user clicks the window,
                         restore it.
                      */

                      if (
                          popup.classList.contains("pdf-minimized") &&
                          windowElement.contains(event.target)
                      ) {
                          /*
                             Don't restore if clicking one of the controls.
                          */

                          if (event.target.closest("button")) {
                              return;
                          }

                          restorePDF();
                      }
                  });


                  /* =========================================================
                     BACKGROUND CLOSE
                     ========================================================= */

                  function closePdfFromBackground(event)
                  {
                      const popup = document.getElementById("pdfPopup");

                      /*
                         Only close when clicking the actual dark background.
                      */

                      if (
                          !popup.classList.contains("pdf-split") &&
                          !popup.classList.contains("pdf-minimized") &&
                          event.target === event.currentTarget
                      ) {
                          closePDF();
                      }
                  }


                  /* =========================================================
                     SPLIT SCREEN
                     ========================================================= */

                  function togglePdfHalfSize() {

                      const popup = document.getElementById("pdfPopup");
                      const windowElement = document.getElementById("pdfWindow");
                      const button = document.getElementById("pdfHalfButton");

                      /* If minimized, restore first */
                      if (popup.classList.contains("pdf-minimized")) {
                          popup.classList.remove("pdf-minimized");
                      }

                      /* Fullscreen must be disabled */
                      windowElement.classList.remove("pdf-expanded");

                      /* Toggle split */
                      const isSplit = popup.classList.toggle("pdf-split");

                      /* Also resize the PAGE */
                      document.body.classList.toggle("pdf-split-mode", isSplit);

                      if (isSplit) {

                          /* PDF occupies top half */
                          document.body.style.overflow = "";

                          button.textContent = "◧";
                          button.title = "Revenir à la taille normale";

                      } else {

                          /* Return to normal popup */
                          document.body.classList.remove("pdf-split-mode");

                          // document.body.style.overflow = "hidden";

                          button.textContent = "◫";
                          button.title = "Demi-écran";
                      }
                  }


                  /* =========================================================
                     FULLSCREEN / EXPAND
                     ========================================================= */

                  function togglePdfSize() {

                      const popup = document.getElementById("pdfPopup");
                      const windowElement = document.getElementById("pdfWindow");
                  const button = document.getElementById("pdfExpandButton");

                  /*
                     If minimized, restore it first.
                  */
                  if (popup.classList.contains("pdf-minimized")) {
                      popup.classList.remove("pdf-minimized");
                  }

                  /*
                     Fullscreen and split cannot be active together.
                     IMPORTANT: also remove the body's split state.
                  */
                  popup.classList.remove("pdf-split");
                  document.body.classList.remove("pdf-split-mode");

                  const isExpanded = windowElement.classList.toggle("pdf-expanded");

                  if (isExpanded) {

                      document.body.style.overflow = "hidden";

                      button.textContent = "↙";
                      button.title = "Réduire";

                  } else {

                              // document.body.style.overflow = "hidden";
                                document.body.style.overflow = "visible";

                              button.textContent = "⛶";
                              button.title = "Agrandir";
                          }
                      }

                </script>
